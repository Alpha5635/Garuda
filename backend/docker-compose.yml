version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: labelsetu-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garuda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garuda_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-labelsetu_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garuda_user} -d ${POSTGRES_DB:-labelsetu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: labelsetu-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: labelsetu-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labelsetu-api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-garuda_user}:${POSTGRES_PASSWORD:-garuda_secure_password}@postgres:5432/${POSTGRES_DB:-labelsetu_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-garuda_user}:${POSTGRES_PASSWORD:-garuda_secure_password}@postgres:5432/${POSTGRES_DB:-labelsetu_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labelsetu-worker
    restart: always
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -c 2
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-garuda_user}:${POSTGRES_PASSWORD:-garuda_secure_password}@postgres:5432/${POSTGRES_DB:-labelsetu_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-garuda_user}:${POSTGRES_PASSWORD:-garuda_secure_password}@postgres:5432/${POSTGRES_DB:-labelsetu_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
