version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: garuda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-garuda_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - garuda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-garuda_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional database management GUI (accessible at http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: garuda-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@garuda.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  garuda_pgdata:
    driver: local
